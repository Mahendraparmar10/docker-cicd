
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker CI/CD Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 5px 20px #00000015;
      max-width: 420px;
    }

    button {
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Docker CI/CD Demo</h1>
    <p>Frontend connected to a Node.js backend.</p>

    <button onclick="getMessage()">
      Connect to Backend
    </button>

    <p id="result">Click the button to test the API.</p>
  </div>

  <script>
    async function getMessage() {
      const result = document.getElementById("result");
      result.textContent = "Connecting...";

      try {
        const response = await fetch("/api/hello");

        if (!response.ok) {
          throw new Error("Backend returned an error");
        }

        const data = await response.json();

        result.textContent =
          `${data.message} | ${data.technology}`;
      } catch (error) {
        result.textContent = "Could not connect to the backend.";
        console.error(error);
      }
    }
  </script>
</body>
</html>
